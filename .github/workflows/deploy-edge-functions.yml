name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ynjipcjddbkwjauznvny
        run: |
          supabase functions deploy process-queue --no-verify-jwt --project-ref $PROJECT_ID
          supabase functions deploy send-test --project-ref $PROJECT_ID
          supabase functions deploy admin-users --project-ref $PROJECT_ID
          supabase functions deploy fetch-sheet --project-ref $PROJECT_ID
